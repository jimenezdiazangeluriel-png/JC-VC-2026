<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Video y Formulario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            background-color: white;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            padding-top: 30px;
        }

        video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        .boton {
            margin-top: 40px;
        }

        .boton a {
            background-color: #000;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .boton a:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- VIDEO ARRIBA -->
        <video controls>
            <source src="video.mp4" type="video/mp4">
            Tu navegador no soporta el video.
        </video>

        <!-- BOTÓN FORMULARIO -->
        <div class="boton">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSd9xS-fWCx4HdPz9dFbMpVMrAtebcfoTJyNhzY4-FL8yeDt8g/viewform" target="_blank">
                Formulario
            </a>
        </div>

    </div>

</body>
</html>
